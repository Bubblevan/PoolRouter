[project]
name = "poolrouter"
version = "0.1.0"
description = "Evidence-led local model router policy"
requires-python = ">=3.12"
dependencies = [
  "litellm==1.103.2",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
